version: '3.9'

# Dati persistenti: bind mount su cartelle locali dell'host (es. Synology).
# Per spostare tutto su un altro server basta copiare le cartelle ./data e ./logs
# insieme a questo docker-compose.yml.
#
# Struttura su disco host:
#   /volume1/docker/smsgateway/
#   ├── docker-compose.yml
#   ├── .env
#   ├── data/
#   │   └── smsgateway.db    ← database SQLite (backup = copia questo file)
#   └── logs/
#       └── app.log

services:

  # Crea le cartelle ./data e ./logs sull'host prima che il backend parta.
  # Necessario su Synology dove Docker non crea automaticamente le cartelle di bind mount.
  init-dirs:
    image: alpine
    command: sh -c "mkdir -p /host/data /host/logs"
    volumes:
      - type: bind
        source: .
        target: /host
    restart: "no"

  backend:
    depends_on:
      init-dirs:
        condition: service_completed_successfully
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smsgateway-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=4673
      - DB_PATH=/app/data/smsgateway.db
      - LOG_FILE=/app/logs/app.log
      # SSO tramite proxy (Authentik, NetScaler ADC, ecc.)
      # Decommenta e imposta nel .env oppure direttamente qui:
      # - SSO_ENABLED=true
      # - SSO_HEADER=X-Remote-User
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - smsgateway-net
    # Expose only internally — frontend nginx proxies to it
    expose:
      - "4673"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smsgateway-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4674}:80"
    depends_on:
      - backend
    networks:
      - smsgateway-net

networks:
  smsgateway-net:
    driver: bridge
